<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(14, 20)">
        <!-- Agent Icon -->
        <g transform="translate(0, 0)">
            <!-- Antenna -->
            <line x1="30" y1="12" x2="30" y2="4" stroke="#0284c7" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="30" cy="3" r="3.5" fill="#0284c7"/>
            <!-- Head -->
            <rect x="10" y="12" width="40" height="24" rx="9" fill="#0ea5e9"/>
            <!-- Eyes -->
            <ellipse cx="22" cy="24" rx="4" ry="4.5" fill="#ffffff"/>
            <ellipse cx="38" cy="24" rx="4" ry="4.5" fill="#ffffff"/>
            <circle cx="23" cy="24" r="2" fill="#0f172a"/>
            <circle cx="37" cy="24" r="2" fill="#0f172a"/>
            <!-- Side Connectors / Ears -->
            <rect x="5" y="19" width="5" height="10" rx="2.5" fill="#0284c7"/>
            <rect x="50" y="19" width="5" height="10" rx="2.5" fill="#0284c7"/>
            <!-- Body ('A' shape) - lightened from #0f172a (near-invisible on the app's
                 near-black dark theme) and given a cyan stroke matching the antenna/ear
                 accents so it reads on any background. -->
            <path d="M 16 80 L 25 42 L 35 42 L 44 80 L 35 80 L 33 66 L 27 66 L 25 80 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 28 57 L 32 57 L 30 48 Z" fill="#ffffff"/>
            <!-- Arms -->
            <path d="M 15 45 C 7 51 7 63 12 71" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round" fill="none"/>
            <path d="M 45 45 C 53 51 53 63 48 71" stroke="#0ea5e9" stroke-width="4.5" stroke-linecap="round" fill="none"/>
        </g>

        <!-- Database Stacks (Tightly Positioned) -->
        <g transform="translate(56, 18)">
            <!-- Stack 1 (Top) -->
            <path d="M 0 10 C 0 4.5, 9 0, 20 0 C 31 0, 40 4.5, 40 10 C 40 15.5, 31 20, 20 20 C 9 20, 0 15.5, 0 10 Z" fill="#38bdf8"/>
            <path d="M 0 10 L 0 20 C 0 25.5, 9 30, 20 30 C 31 30, 40 25.5, 40 20 L 40 10 C 40 15.5, 31 20, 20 20 C 9 20, 0 15.5, 0 10 Z" fill="#0284c7"/>
            <circle cx="30" cy="21" r="2" fill="#ffffff"/>

            <!-- Stack 2 (Middle) -->
            <path d="M 0 25 L 0 35 C 0 40.5, 9 45, 20 45 C 31 45, 40 40.5, 40 35 L 40 25 C 40 30.5, 31 35, 20 35 C 9 35, 0 30.5, 0 25 Z" fill="#0369a1"/>
            <circle cx="30" cy="36" r="2" fill="#ffffff"/>

            <!-- Stack 3 (Bottom) -->
            <path d="M 0 40 L 0 50 C 0 55.5, 9 60, 20 60 C 31 60, 40 55.5, 40 50 L 40 40 C 40 45.5, 31 50, 20 50 C 9 50, 0 45.5, 0 40 Z" fill="#0f172a"/>
            <circle cx="30" cy="51" r="2" fill="#38bdf8"/>
        </g>
    </g>
</svg>
