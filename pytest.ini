[pytest]

# These are all noise from third-party dependencies (urllib3, google-api-core,
# google-auth, google-genai's bundled Pydantic model) - nothing in this
# project's own code triggers them, so there's nothing here to "fix" other
# than the environment they run in. Silenced by message rather than by
# importing each library's specific warning class, so this keeps working
# across dependency version bumps without needing updates.
filterwarnings =
    # macOS's system Python links against LibreSSL instead of OpenSSL;
    # urllib3 v2 warns about that on every import. Harmless for local
    # dev/test - a proper OpenSSL-linked Python (e.g. via pyenv/homebrew)
    # makes this go away for good, but until then it's just noise.
    ignore:urllib3 v2 only supports OpenSSL 1\.1\.1\+.*:Warning
    # google-api-core / google-auth nag that Python 3.9 is past end-of-life
    # on every import. True, and worth upgrading (see venv note above), but
    # not something to re-litigate on every test run.
    ignore:You are using a non-supported Python version.*:FutureWarning
    ignore:You are using a Python version .* past its end of life.*:FutureWarning
    # google-genai's bundled Pydantic v2 model uses a validator pattern that's
    # deprecated upstream (github.com/googleapis/python-genai) - nothing to
    # change on our side, just waiting on their next release.
    ignore:Using `@model_validator` with mode=.after. on a classmethod is deprecated.*:DeprecationWarning
    # snowflake-connector-python's vendored copy of requests checks its
    # bundled urllib3/chardet versions against what's actually installed on
    # every import - a version-skew notice about a dependency's own vendored
    # dependency, nothing this project controls.
    ignore:urllib3 \(.*\) or chardet.*doesn't match a supported version.*:Warning
