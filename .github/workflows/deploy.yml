name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image with Git SHA
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-apps/${{ github.event.repository.name }}:${{ github.sha }}"
          LATEST_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-apps/${{ github.event.repository.name }}:latest"
          
          docker build -t $IMAGE_TAG -t $LATEST_TAG .
          docker push $IMAGE_TAG
          docker push $LATEST_TAG

        - name: Write env.yaml from Secret
        env:
          ENV_YAML_CONTENT: ${{ secrets.ENV_YAML }}
        run: |
          echo "$ENV_YAML_CONTENT" > env.yaml

      - name: Deploy to Cloud Run
        run: |
          IMAGE_TAG="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-apps/${{ github.event.repository.name }}:${{ github.sha }}"
          gcloud run deploy ${{ github.event.repository.name }} \
            --image $IMAGE_TAG \
            --region us-central1 \
            --platform managed \
            --env-vars-file=env.yaml

      - name: Clean up temporary env.yaml
        if: always()
        run: rm -f env.yaml